global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: tealair-vps

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics — node_exporter runs on the host, not in a container
  - job_name: node
    static_configs:
      - targets: ['10.89.2.1:9100']

  # These exporters are separate containers on the same networks as their targets
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres_exporter:9187']

  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis_exporter:9121']

  # - job_name: nginx
  #   static_configs:
  #     - targets: ['nginx_exporter:9113']
